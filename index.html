
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#07552f">
  <meta name="description" content="Aplicación AFA STOCK para control de inventario">

  <title>AFA STOCK</title>

  <!-- Configuración de instalación -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Compatibilidad con iPhone y iPad -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AFA STOCK">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      background: #eaf3ed;
      font-family: Arial, sans-serif;
      color: #07552f;
      text-align: center;
    }

    main {
      width: min(100%, 420px);
      padding: 35px 22px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 22px #00000015;
    }

    h1 {
      margin: 0 0 12px;
    }

    p {
      line-height: 1.5;
    }

    a {
      display: block;
      margin-top: 25px;
      padding: 16px;
      border-radius: 12px;
      background: #08783d;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:focus-visible {
      outline: 3px solid #9bd36b;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>
    <h1>🛒 AFA STOCK</h1>

    <p>Control de inventario</p>

    <p>Ingresá para comenzar el conteo de productos.</p>

    <a href="https://script.google.com/macros/s/AKfycbz4YJhAtrlLRmPuvYDRZthyWud7VxtpF4RCwiTHdA0QKrC26c3KJ7ocCyoft8LURZmS3Q/exec">
      INGRESAR A AFA STOCK
    </a>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => {
            console.error(
              "No se pudo registrar el servicio:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
