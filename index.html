
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07552f">
  <meta name="description" content="Aplicación AFA STOCK para control de inventario">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>AFA STOCK</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eaf3ed;
      font-family: Arial, sans-serif;
      color: #07552f;
      text-align: center;
    }
    main {
      width: min(90%, 420px);
      padding: 35px 22px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 22px #00000015;
    }
    h1 { margin: 0 0 12px; }
    p { line-height: 1.5; }
    a {
      display: block;
      margin-top: 25px;
      padding: 16px;
      border-radius: 12px;
      background: #08783d;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>🛒 AFA STOCK</h1>
    <p>Control de inventario</p>
    <p>Ingresá para comenzar el conteo de productos.</p>
    <a href="https://script.google.com/macros/s/AKfycbz4YJhAtrlLRmPuvYDRZthyWud7VxtpF4RCwiTHdA0QKrC26c3KJ7ocCyoft8LURZmS3Q/exec">
      INGRESAR A AFA STOCK
    </a>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
